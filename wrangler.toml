name = "scouting-report"
main = "src/worker.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scouting-report"
# Replace with the id printed by: npx wrangler d1 create scouting-report
database_id = "00000000-0000-0000-0000-000000000000"
